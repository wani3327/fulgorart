{% for image in images %}
<div class="masonry-card{% if image.group_size > 1 %} folded{% endif %}"{% if image.group_size > 1 %} data-post-id="{{ image.post_id }}"{% endif %}>
  <a href="/image/{{ image.id }}"><img src="{{ image.url }}"{% if image.width and image.height %} width="{{ image.width }}" height="{{ image.height }}"{% endif %}{% if loop.index <= eager_count %} loading="eager" fetchpriority="high"{% else %} loading="lazy"{% endif %} decoding="async" alt="image {{ image.id }}"/></a>
  {% if image.group_size > 1 %}<span class="fold-badge" aria-label="{{ image.group_size }} images, tap to unfold">{{ image.group_size }}</span>{% endif %}
</div>
{% endfor %}
