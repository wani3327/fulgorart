<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="/style.css"/>
  <title>Image {{ id }}</title>
</head>
<body class="image-page" data-image-id="{{ id }}">
<main class="page-shell image-layout">
  <header class="page-header">
    <div>
      <p class="page-subtitle"><a href="/">← Back to gallery</a></p>
      <h1 class="page-title">Image #{{ id }}</h1>
    </div>
  </header>
  <section class="image-panel image-frame">
    <img src="{{ url }}" alt="image {{ id }}"/>
  </section>
  <section class="image-panel">
    <h2 class="section-title">Tags</h2>
    <div id="tags" class="tag-list">
  {% for tag in tags %}
  <span class="tag" data-tag-id="{{ tag.id }}">{{ tag.name }} <button type="button" class="remove-tag" data-tag-id="{{ tag.id }}">×</button></span>
  {% endfor %}
    </div>
    <div class="controls controls-spaced">
    <input id="newtag" placeholder="add tag..." list="taglist"/>
    <button type="button" id="add-tag-button">Add</button>
    </div>
  </section>
  <script>
  const imageId = document.body.dataset.imageId;
  const addTagButton = document.getElementById('add-tag-button');
  const tagInput = document.getElementById('newtag');
  const tagButtons = document.querySelectorAll('.remove-tag');

  async function addTag() {
    const tag = tagInput.value.trim();
    if (!tag) return;
    await fetch('/api/images/' + imageId + '/tags', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({tag})
    });
    location.reload();
  }

  async function removeTag(tagId) {
    await fetch('/api/images/' + imageId + '/tags/' + tagId, {method: 'DELETE'});
    location.reload();
  }

  addTagButton.addEventListener('click', addTag);
  tagButtons.forEach((button) => {
    button.addEventListener('click', () => removeTag(button.dataset.tagId));
  });

  </script>
</main>
</body>
</html>
