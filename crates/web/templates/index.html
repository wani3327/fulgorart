<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="/style.css"/>
<title>FulgorArt</title>
</head>
<body data-next-page="{{ next_page }}" data-per-page="{{ per_page }}" data-has-more="{{ has_more }}">
<main class="page-shell">
<header class="page-header">
  <h1 class="page-title">FulgorArt</h1>
  <p class="page-subtitle"><span id="image-count">{{ count }}</span> images loaded</p>
</header>
<div class="grid" id="image-grid">{{ cards_html|safe }}</div>
<div class="sentinel" id="scroll-sentinel"></div>
<script>
(() => {
  const grid = document.getElementById('image-grid');
  const count = document.getElementById('image-count');
  const sentinel = document.getElementById('scroll-sentinel');
  const { nextPage: nextPageValue, perPage: perPageValue, hasMore: hasMoreValue } = document.body.dataset;
  let nextPage = Number(nextPageValue);
  const perPage = Number(perPageValue);
  let loading = false;
  let hasMore = hasMoreValue === 'True';

  const observer = new IntersectionObserver((entries) => {
    if (entries.some((entry) => entry.isIntersecting)) {
      loadMore();
    }
  }, { rootMargin: '800px' });

  async function loadMore() {
    if (loading || !hasMore) return;
    loading = true;

    try {
      const response = await fetch(`/api/index/cards?page=${nextPage}&per_page=${perPage}`);
      if (!response.ok) {
        return;
      }

      const html = await response.text();
      const responseHasMore = response.headers.get('x-has-more') === 'true';
      const container = document.createElement('div');
      container.innerHTML = html;
      while (container.firstChild) {
        grid.appendChild(container.firstChild);
      }
      count.textContent = String(grid.children.length);
      nextPage += 1;
      hasMore = responseHasMore;
      if (!hasMore) {
        observer.disconnect();
      }
    } finally {
      loading = false;
    }
  }

  observer.observe(sentinel);
  if (!hasMore) {
    observer.disconnect();
  }
})();
</script>
</main>
</body>
</html>
