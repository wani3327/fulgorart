<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="/style.css"/>
<title>FulgorArt</title>
</head>
<body data-next-page="{{ next_page }}" data-per-page="{{ per_page }}" data-has-more="{{ has_more }}">
<main class="app-shell">
<header class="app-header">
  <h1 class="app-title">FulgorArt</h1>
  <p class="app-subtitle"><span id="gallery-count">{{ count }}</span> images loaded</p>
</header>
<div class="masonry-gallery" id="masonry-gallery">
  <div class="masonry-column" id="masonry-column-left"></div>
  <div class="masonry-column" id="masonry-column-right"></div>
  <div class="card-stream" id="card-stream">{{ cards_html|safe }}</div>
</div>
<div class="gallery-sentinel" id="gallery-sentinel"></div>
<script>
(() => {
  const gallery = document.getElementById('masonry-gallery');
  const leftColumn = document.getElementById('masonry-column-left');
  const rightColumn = document.getElementById('masonry-column-right');
  const stream = document.getElementById('card-stream');
  const count = document.getElementById('gallery-count');
  const sentinel = document.getElementById('gallery-sentinel');
  const { nextPage: nextPageValue, perPage: perPageValue, hasMore: hasMoreValue } = document.body.dataset;
  let nextPage = Number(nextPageValue);
  const perPage = Number(perPageValue);
  let loading = false;
  let hasMore = hasMoreValue === 'True';

  function appendCards(container) {
    while (container.firstElementChild) {
      const card = container.firstElementChild;
      const targetColumn = leftColumn.offsetHeight <= rightColumn.offsetHeight
        ? leftColumn
        : rightColumn;
      targetColumn.appendChild(card);
    }
    count.textContent = String(gallery.querySelectorAll('.masonry-card').length);
  }

  appendCards(stream);

  const observer = new IntersectionObserver((entries) => {
    if (entries.some((entry) => entry.isIntersecting)) {
      loadMore();
    }
  }, { rootMargin: '800px' });

  async function loadMore() {
    if (loading || !hasMore) return;
    loading = true;

    try {
      const response = await fetch(`/api/index/cards?page=${nextPage}&per_page=${perPage}`);
      if (!response.ok) {
        return;
      }

      const html = await response.text();
      const responseHasMore = response.headers.get('x-has-more') === 'true';
      const container = document.createElement('div');
      container.innerHTML = html;
      appendCards(container);
      nextPage += 1;
      hasMore = responseHasMore;
      if (!hasMore) {
        observer.disconnect();
      }
    } finally {
      loading = false;
    }
  }

  observer.observe(sentinel);
  if (!hasMore) {
    observer.disconnect();
  }
})();
</script>
</main>
</body>
</html>
