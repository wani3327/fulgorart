<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="/style.css"/>
<title>FulgorArt</title>
</head>
<body data-next-page="{{ next_page }}" data-per-page="{{ per_page }}" data-has-more="{{ has_more }}">
<main class="app-shell">
<header class="app-header">
  <h1 class="app-title">FulgorArt</h1>
  <p class="app-subtitle"><span id="gallery-count">{{ count }}</span> images loaded</p>
</header>
<div class="masonry-gallery" id="masonry-gallery">
  <div class="masonry-column" id="masonry-column-left"></div>
  <div class="masonry-column" id="masonry-column-right"></div>
  <div class="card-stream" id="card-stream">{{ cards_html|safe }}</div>
</div>
<div class="gallery-sentinel" id="gallery-sentinel"></div>
<script>
(() => {
  const gallery = document.getElementById('masonry-gallery');
  const leftColumn = document.getElementById('masonry-column-left');
  const rightColumn = document.getElementById('masonry-column-right');
  const stream = document.getElementById('card-stream');
  const count = document.getElementById('gallery-count');
  const sentinel = document.getElementById('gallery-sentinel');
  const { nextPage: nextPageValue, perPage: perPageValue, hasMore: hasMoreValue } = document.body.dataset;
  let nextPage = Number(nextPageValue);
  const perPage = Number(perPageValue);
  let loading = false;
  let hasMore = hasMoreValue === 'True';

  // Column heights in "column widths": each card adds its image's aspect
  // ratio (height / width, from the <img> width/height attributes) plus a
  // little for the gap. Known up front, so no layout reads per card.
  const CARD_GAP = 0.04;
  const columnHeights = [0, 0];
  let cardCount = 0;

  function cardRatio(card) {
    const img = card.querySelector('img');
    const w = Number(img && img.getAttribute('width'));
    const h = Number(img && img.getAttribute('height'));
    return w > 0 && h > 0 ? h / w : 1;
  }

  function appendCards(container) {
    const fragments = [document.createDocumentFragment(), document.createDocumentFragment()];
    for (const card of Array.from(container.children)) {
      const column = columnHeights[0] <= columnHeights[1] ? 0 : 1;
      columnHeights[column] += cardRatio(card) + CARD_GAP;
      fragments[column].appendChild(card);
      cardCount += 1;
    }
    leftColumn.appendChild(fragments[0]);
    rightColumn.appendChild(fragments[1]);
    count.textContent = String(cardCount);
  }

  appendCards(stream);

  const observer = new IntersectionObserver((entries) => {
    if (entries.some((entry) => entry.isIntersecting)) {
      loadMore();
    }
  }, { rootMargin: '800px' });

  async function loadMore() {
    if (loading || !hasMore) return;
    loading = true;

    try {
      const response = await fetch(`/api/index/cards?page=${nextPage}&per_page=${perPage}`);
      if (!response.ok) {
        return;
      }

      const html = await response.text();
      const responseHasMore = response.headers.get('x-has-more') === 'true';
      const container = document.createElement('div');
      container.innerHTML = html;
      appendCards(container);
      nextPage += 1;
      hasMore = responseHasMore;
      if (!hasMore) {
        observer.disconnect();
      }
    } finally {
      loading = false;
    }
  }

  observer.observe(sentinel);
  if (!hasMore) {
    observer.disconnect();
  }
})();
</script>
</main>
</body>
</html>
