name: Build and Push Tagger Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  docker:
    name: Build and push fulgorart-tagger
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker tags
        id: meta
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/fulgorart-tagger"
          TAGS="${IMAGE}:latest"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${IMAGE}:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          make docker-build-tagger \
            TAGGER_IMAGE_NAME=fulgorart-tagger \
            TAGGER_IMAGE_TAG=latest

      - name: Tag and push Docker image
        run: |
          set -e
          for TAG in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do
            docker tag fulgorart-tagger:latest "${TAG}"
            docker push "${TAG}"
          done
