name: Build and Push gallery-dl Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "deploy/gdl/**"
      - ".github/workflows/docker-build-gdl.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/gdl
          file: ./deploy/gdl/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fulgorart-gdl:latest
          cache-from: type=gha,scope=gdl
          cache-to: type=gha,mode=max,scope=gdl
